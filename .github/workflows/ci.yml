name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      # Type-checks src/ AND tests/ (audit M5) — the build tsconfig excludes
      # tests/, so before this a test could drift from the types it pins down
      # and still go green, since vitest transpiles without type-checking.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
